api:
  dashboard: true
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  intranet:
    address: ":8081"
  postgres:
    address: ":5432"
  wireguard-udp:
    address: ":51820/udp"
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@example.com
      storage: /etc/traefik/acme.json
      httpChallenge:
        entryPoint: web
providers:
  file:
    directory: /etc/traefik/conf.d
    watch: true
experimental:
  plugins:
    crowdsec:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.4.4
    geoblock:
      moduleName: github.com/PascalMinder/geoblock
      version: v0.2.9
    rewritebody:
      moduleName: github.com/traefik/plugin-rewritebody
      version: v0.3.1
log:
  level: INFO
