name: Tests

on:
  push:
    branches:
      - dev
      - "refactor/**"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (pyflakes)
        run: python -m pyflakes app.py core tests

      - name: Run tests
        run: pytest -q

  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: agent/go.sum

      - name: Build agent
        working-directory: agent
        run: go build ./...

      - name: Vet agent
        working-directory: agent
        run: go vet ./...

      - name: Test agent
        working-directory: agent
        run: go test ./...
